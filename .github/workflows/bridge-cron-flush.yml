# Hourly trigger for the wake/sync SYNC batch flush (POST /api/cron).
# The endpoint decides what is due: an America/Chicago even hour that has
# passed (late runs still deliver), or data that would otherwise wait more than
# 2 elapsed hours (DST). Every other run is a 200 no-op. Configure in the repository:
#   secret   CRON_SECRET     - same value as the Vercel CRON_SECRET (16+ chars)
#   variable BRIDGE_CRON_URL - full https URL of the deployed /api/cron route
# Missing or empty, either one fails the run loudly (configure both before
# this workflow is on the default branch, or disable it). Any non-2xx response
# from the route also fails the run.
name: Bridge SYNC flush
on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: bridge-cron-flush
  cancel-in-progress: false
jobs:
  flush:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: POST cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          BRIDGE_CRON_URL: ${{ vars.BRIDGE_CRON_URL }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${CRON_SECRET:-}" ] || missing="$missing secret CRON_SECRET"
          [ -n "${BRIDGE_CRON_URL:-}" ] || missing="$missing variable BRIDGE_CRON_URL"
          if [ -n "$missing" ]; then
            echo "::error::Bridge SYNC flush is not configured; missing repository${missing}. No flush was attempted."
            exit 1
          fi
          case "$BRIDGE_CRON_URL" in
            https://*) ;;
            *) echo "::error::BRIDGE_CRON_URL must be an https:// URL."; exit 1 ;;
          esac
          body="$(mktemp)"
          # The header is read from stdin so the secret never appears in argv.
          # --fail-with-body fails (after retries) on 4xx/5xx; redirects are not
          # followed, so the explicit check below also rejects 1xx/3xx.
          status="$(printf 'Authorization: Bearer %s\n' "$CRON_SECRET" | curl --silent --show-error --fail-with-body \
            --proto '=https' --connect-timeout 10 --max-time 30 \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST --header @- --output "$body" --write-out '%{http_code}' "$BRIDGE_CRON_URL")" || {
            cat "$body"; echo; echo "::error::Bridge SYNC flush request failed (HTTP ${status:-none})."; exit 1; }
          cat "$body"; echo
          case "$status" in
            2??) ;;
            *) echo "::error::Bridge SYNC flush returned HTTP $status."; exit 1 ;;
          esac
