name: Project checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.3'
          cache: npm
      - run: npm ci --ignore-scripts
      # Vercel compiles api/*.ts without type checking (noCheck), so the strict
      # typecheck and a clean emitted-JavaScript compile/load check gate here.
      - run: npm run typecheck
      - run: npm run compile:check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - run: python3 scripts/audit_repo.py
