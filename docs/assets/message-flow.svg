<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 478" width="320" height="478" role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">Agent Bridge message flow</title>
  <desc id="flow-desc">Six steps from top to bottom. 1: the sender assistant calls bridge_message_send. 2: the bridge stores the message and an outbox job in one transaction. 3: a queued wake carries only the message ID. 4: the recipient signs in to read, claim and handle the message. 5: completing the receipt atomically creates one correlated ACK. 6: the sender receives the ACK event; ACKs are terminal and never acknowledged.</desc>
  <style>
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.5; }
    .ack { fill: #dafbe1; stroke: #1a7f37; }
    .t { fill: #1f2328; font: 600 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .s { fill: #424a53; font: 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .arrow { stroke: #57606a; stroke-width: 1.5; }
    .head { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #8b949e; }
      .ack { fill: #0f2a19; stroke: #3fb950; }
      .t { fill: #e6edf3; }
      .s { fill: #c9d1d9; }
      .arrow { stroke: #8b949e; }
      .head { fill: #8b949e; }
    }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>
  <g>
    <rect class="box" x="20" y="12" width="280" height="54" rx="8"/>
    <text class="t" x="160" y="35">Sender assistant</text>
    <text class="s m" x="160" y="55">bridge_message_send</text>

    <rect class="box" x="20" y="92" width="280" height="54" rx="8"/>
    <text class="t" x="160" y="115">Bridge stores message</text>
    <text class="s" x="160" y="135">+ outbox job, one transaction</text>

    <rect class="box" x="20" y="172" width="280" height="54" rx="8"/>
    <text class="t" x="160" y="195">Queued wake</text>
    <text class="s" x="160" y="215">carries the message ID only</text>

    <rect class="box" x="20" y="252" width="280" height="54" rx="8"/>
    <text class="t" x="160" y="275">Recipient signs in</text>
    <text class="s" x="160" y="295">read → claim → handle</text>

    <rect class="box ack" x="20" y="332" width="280" height="54" rx="8"/>
    <text class="t" x="160" y="355">Complete receipt</text>
    <text class="s" x="160" y="375">+ correlated ACK, atomically</text>

    <rect class="box ack" x="20" y="412" width="280" height="54" rx="8"/>
    <text class="t" x="160" y="435">Sender receives the ACK</text>
    <text class="s" x="160" y="455">terminal: never acknowledged</text>
  </g>
  <g>
    <line class="arrow" x1="160" y1="66" x2="160" y2="90" marker-end="url(#head)"/>
    <line class="arrow" x1="160" y1="146" x2="160" y2="170" marker-end="url(#head)"/>
    <line class="arrow" x1="160" y1="226" x2="160" y2="250" marker-end="url(#head)"/>
    <line class="arrow" x1="160" y1="306" x2="160" y2="330" marker-end="url(#head)"/>
    <line class="arrow" x1="160" y1="386" x2="160" y2="410" marker-end="url(#head)"/>
  </g>
</svg>
